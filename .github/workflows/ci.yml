name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Python regression and safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-lock.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Check whitespace
        run: git diff --check
      - name: Run non-PostgreSQL regression suite
        run: python -m pytest -q -m "not postgres"
      - name: Verify release documentation when freeze tag is present
        shell: bash
        run: |
          if git tag --list 'interview-freeze-2026-09-05' | grep -q .; then
            python scripts/verify_release_consistency.py --tag interview-freeze-2026-09-05
          else
            echo "Freeze tag not present in this checkout; documentation check deferred."
          fi

  postgres:
    name: PostgreSQL and RLS integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: after_sales_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d after_sales_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-lock.txt
      - name: Run PostgreSQL/RLS tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/after_sales_ci
        run: python -m pytest -q -m postgres

