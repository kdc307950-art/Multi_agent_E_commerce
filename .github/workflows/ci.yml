name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Python regression and safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-lock.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Check whitespace
        run: git diff --check
      - name: Run non-PostgreSQL regression suite
        run: python -m pytest -q -m "not postgres"
      - name: Verify release documentation when freeze tag is present
        shell: bash
        run: |
          if git tag --list 'interview-freeze-2026-09-05' | grep -q .; then
            python scripts/verify_release_consistency.py --tag interview-freeze-2026-09-05
          else
            echo "Freeze tag not present in this checkout; documentation check deferred."
          fi

  postgres:
    name: PostgreSQL and RLS integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: after_sales_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d after_sales_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-lock.txt
      - name: Run PostgreSQL/RLS tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/after_sales_ci
        run: python -m pytest -q -m postgres

  milvus-lite:
    name: Milvus Lite tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install backend and local Milvus dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pymilvus==3.0.1 milvus-lite==3.2.1
      - name: Run Milvus Lite isolation tests
        run: python -m pytest -q tests/test_milvus_lite_integration.py tests/test_milvus_embedding_provider.py

  dependency-security:
    name: Dependency security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install audit tooling and locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pip-audit
      - name: Audit locked Python dependencies
        run: pip-audit -r requirements-lock.txt
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit locked frontend dependencies
        working-directory: frontend
        run: npm_config_registry=https://registry.npmjs.org npm audit --audit-level=high
