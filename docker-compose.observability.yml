# Docker Compose — 自托管可观测链路（监控 / 日志 / Trace / 审计）
#
# 完全自托管纪律：Langfuse（trace）、Prometheus + Grafana（指标）、Loki + Promtail（日志）
# 全部由项目方部署，不接任何第三方托管 SaaS；应用侧出网被限制在受控内网。
#
# 与预览栈（docker-compose.preview.yml，项目名 after-sales-preview）协同：
#   - 通过外部网络 after-sales-preview_internal 抓取 api:8000/api/metrics（Prometheus）；
#   - 应用经 LANGFUSE_* 环境变量向 langfuse:3000 上报 trace（未配置则 no-op）；
#   - 日志已在应用内全局 PII 脱敏（订单地址/支付信息/密钥均掩码），promtail 只采集转运。
#
# 用法：
#   docker compose --env-file deploy/.env.preview -f docker-compose.observability.yml up -d
#   docker compose --env-file deploy/.env.preview -f docker-compose.observability.yml down
# 建议把 deploy/scripts/observability.sh 作为入口（幂等启停 + 健康检查）。
#
# 注意：网络 after-sales-preview_internal 由 preview 栈创建；需先启动 preview 再启动本栈。

name: after-sales-observability

services:
  # ---- Langfuse（自托管全链路 trace）----
  # ---- ClickHouse（langfuse v3 事件存储；内部网，不发布宿主端口）----
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${LANGFUSE_CLICKHOUSE_PASSWORD:?LANGFUSE_CLICKHOUSE_PASSWORD 必须由密钥注入}
      - CLICKHOUSE_DEFAULT_DATABASE=default
    networks: [obs]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"${LANGFUSE_CLICKHOUSE_PASSWORD}\" --query \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---- MinIO（langfuse v3 S3 对象存储；事件/媒体上传；内部网，不发布宿主端口）----
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=${LANGFUSE_MINIO_ROOT_USER:?LANGFUSE_MINIO_ROOT_USER 必须由密钥注入}
      - MINIO_ROOT_PASSWORD=${LANGFUSE_MINIO_ROOT_PASSWORD:?LANGFUSE_MINIO_ROOT_PASSWORD 必须由密钥注入}
    volumes: ["./data/minio:/data"]
    networks: [obs]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  langfuse:
    # langfuse v3：ClickHouse（事件存储）+ postgres（应用库）+ redis（队列）。入口自动跑
    # postgres 与 clickhouse 迁移（prisma migrate deploy + clickhouse up.sh），无需单独 migrate 服务。
    image: langfuse/langfuse:3
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0            # Next.js 以 Docker 提供的 HOSTNAME(容器ID) 绑定到 eth0 IP 而非 loopback，导致 localhost:3000 healthcheck 拒连；显式设为 0.0.0.0 使服务在 loopback + eth0 均可达。
      - DATABASE_URL=postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD 必须由密钥注入}@langfuse-postgres:5432/langfuse
      - DIRECT_URL=postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD 必须由密钥注入}@langfuse-postgres:5432/langfuse
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_PASSWORD=${LANGFUSE_CLICKHOUSE_PASSWORD:?LANGFUSE_CLICKHOUSE_PASSWORD 必须由密钥注入}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - REDIS_HOST=langfuse-redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD 必须由密钥注入}
      - SALT=${LANGFUSE_SALT:?LANGFUSE_SALT 必须由密钥注入}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY 必须由密钥注入}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET 必须由密钥注入}
      - NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      # langfuse v3 S3（MinIO）事件/媒体上传对象存储（内部网，force_path_style）
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_MINIO_ROOT_USER:?LANGFUSE_MINIO_ROOT_USER 必须由密钥注入}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_MINIO_ROOT_PASSWORD:?LANGFUSE_MINIO_ROOT_PASSWORD 必须由密钥注入}
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse-events
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_MINIO_ROOT_USER:?LANGFUSE_MINIO_ROOT_USER 必须由密钥注入}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_MINIO_ROOT_PASSWORD:?LANGFUSE_MINIO_ROOT_PASSWORD 必须由密钥注入}
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse-media
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media
      - TELEMETRY_ENABLED=false            # 完全自托管：关闭匿名遥测
    networks: [obs]
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      langfuse-postgres:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    healthcheck:
      # 容器内 localhost 解析为 IPv6 ::1，而 Next.js 服务监听 IPv4(0.0.0.0)；故用 127.0.0.1 显式指定 IPv4 loopback。
      test: ["CMD", "wget", "-qO-", "-T", "3", "http://127.0.0.1:3000/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  langfuse-postgres:
    image: docker.1ms.run/library/postgres:16-alpine
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD:?LANGFUSE_DB_PASSWORD 必须由密钥注入}
      - POSTGRES_DB=langfuse
    volumes: ["./data/langfuse-postgres:/var/lib/postgresql/data"]
    networks: [obs]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 12

  langfuse-redis:
    image: docker.1ms.run/library/redis:7-alpine
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD 必须由密钥注入}"]
    networks: [obs]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---- Prometheus（指标抓取；标签有界，绝不含 tenant_id）----
  prometheus:
    image: docker.1ms.run/library/prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./data/prometheus:/prometheus
    networks: [obs, app-net, prod-net]   # app-net 抓取 preview api；prod-net 抓取 prod api(/api/metrics)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "3", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---- Alertmanager（告警路由/通知；完全自托管，obs 内网，不发布宿主端口）----
  # 接收 prometheus alerting 段的推送，按 alertmanager.yml 路由/分组并通过 webhook 通知到自托管接收端。
  alertmanager:
    image: prom/alertmanager:v0.27.0    # 镜像源 docker.1ms.run 未收录 alertmanager，故用 docker.io（本地自托管运行）
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./data/alertmanager:/alertmanager
    networks: [obs]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "3", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---- Alertmanager webhook 接收端（自托管 sink：捕获告警到 JSONL 并回 200；obs 内网可达）----
  # 接收脚本在 deploy/observability/evidence/mock_webhook_receiver.py（t4/t11 共用，仅标准库）。
  alert-webhook-sink:
    image: python:3.12-alpine            # 镜像源 docker.1ms.run 该 layer 不可用，故用 docker.io（本地自托管运行）
    command: ["python", "/app/mock_webhook_receiver.py"]
    environment:
      - SINK_OUT=/data/inbox.jsonl
      - SINK_PORT=8080
    volumes:
      - ./deploy/observability/evidence/mock_webhook_receiver.py:/app/mock_webhook_receiver.py:ro
      - ./data/alertmanager-webhooks:/data
    networks: [obs]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---- Grafana（展示；看板/告警由项目方维护）----
  grafana:
    image: docker.1ms.run/library/grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 必须由密钥注入}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes: ["./data/grafana:/var/lib/grafana"]
    networks: [obs]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "3", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---- Loki（日志存储；应用已 PII 脱敏，此处只采集转运）----
  loki:
    image: docker.1ms.run/library/grafana/loki:3.1.0
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./deploy/observability/loki-config.yml:/etc/loki/config.yml:ro
      - ./data/loki:/loki
    networks: [obs]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "3", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---- Promtail（采集容器 stdout 日志；应用日志已脱敏）----
  promtail:
    image: docker.1ms.run/library/grafana/promtail:3.1.0
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./deploy/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [obs, app-net]
    depends_on:
      loki:
        condition: service_healthy

networks:
  # 可观测自网（内网；不发布宿主端口）
  obs:
    driver: bridge
    internal: true
  # 复用预览栈内网（抓取 preview api:8000、跟随应用容器日志），需先启动 preview 栈。
  app-net:
    external: true
    name: after-sales-preview_internal
  # 复用生产栈内网（抓取 prod api /api/metrics，172.31.0.0/16），需先启动 prod 栈。
  # 与生产 METRICS_ALLOWED_SOURCES=172.31.0.0/16 闭环。
  prod-net:
    external: true
    name: after-sales-prod_internal
