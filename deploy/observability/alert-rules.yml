# Prometheus 告警规则（正式交付 · 最终版）
# ============================================================================
# 挂载：deploy/observability/prometheus.yml 的 rule_files 指向 /etc/prometheus/alert-rules.yml，
#       故本文件为"权威规则"，经 docker-compose.observability.yml 的 prometheus 服务挂载到该路径。
# 口径纪律（与 src/observability/metrics.py::_FORBIDDEN_LABELS 一致）：标签用**有界维度**（route/status/kind/node/job/component），
#       绝不用高基数/敏感维度（tenant_id/user_id/thread_id/order_id/operation_id/approval_id/client_request_id/...）。
#       租户明细走受控审计查询（GET /api/audit），不入 Prometheus 标签。
# 真实指标名（来自 src/observability/metrics.py 与 src/api/routes.py / src/execution/engine.py，未编造）：
#   - api_requests_total{route,method,status}      (counter)  由 HTTP 中间件统一记录
#   - approval_decisions_total{route,status}       (counter)  status ∈ approved|rejected|timeout|replay|error|forbidden
#   - approval_decision_latency_seconds{route}     (histogram)
#   - audit_queries_total{route}                   (counter)
#   - login_attempts_total{result}                 (counter)
#   - login_rate_limited_total{reason}             (counter)
#   - security_denials_total{kind}                 (counter)  kind = 审计拒绝 reason（固定集合）
#   - human_intervention_total{kind}               (counter)  kind ∈ order_deny|approval_timeout|execution_handoff|reconcile_mismatch|escalate|...
#   - reconcile_mismatch_total{kind}               (counter)  kind = 归一化 mismatch reason（有界）
#   - reconcile_last_run_timestamp_seconds         (gauge)
#   - execution_submit_total{mode}                 (counter)  mode=shadow|live
#   - execution_outcome_total{mode,status}         (counter)
#   - execution_callback_total{reason}             (counter)
#   - drill_rpo_seconds{component} / drill_rto_seconds{component}  (gauge)  由备份恢复演练脚本写入
#   - Prometheus 自动生成：up{job=...}
# 说明：组件存活(up)与登录暴力破解规则可立即生效；其余规则所依赖的有界指标**已在代码中接入**，
#       表达式不再为空；个别依赖尚未实现的指标（如下方 component_restart_total）仍标注"未接入"，不会误报。
# 双 job 口径提示（t3 起 Prometheus 同时抓取 preview(job="api") 与 prod(job="api_prod")）：
#       api_requests_total / approval_decisions_total / human_intervention_total 等计数会同时出现在两 job。
#       下方 ApiHighErrorRate 已按 job+route+method 分维，避免 preview+prod 混算/稀释误报；
#       其余以 api_requests_total 为分母的规则（如 HighHumanInterventionRate）与 approval_decisions_total
#       相关规则暂未按 job 拆，t11 告警演练时按需复核（保持单一权威文件，谨慎改动）。
# ============================================================================

groups:
  # ---- 组件存活 / 抓取健康（可立即生效）----
  - name: after-sales-component-health
    rules:
      - alert: ApiJobDown
        expr: up{job="api"} == 0
        for: 1m
        labels: {severity: critical, component: api, env: preview}
        annotations:
          summary: "API 抓取失败（job=api）"
          description: "Prometheus 抓不到 /api/metrics（api:8000）。API down 或不可达；值班按 OPS_RUNBOOK §4 处理。"

      - alert: PrometheusJobDown
        expr: up{job="prometheus"} == 0
        for: 2m
        labels: {severity: warning, component: prometheus, env: preview}
        annotations:
          summary: "Prometheus 自身 down"
          description: "观测链路中断。检查 prometheus 容器。"

      - alert: LokiJobDown
        expr: up{job="loki"} == 0
        for: 2m
        labels: {severity: warning, component: loki, env: preview}
        annotations:
          summary: "Loki 抓取失败"
          description: "日志存储链路可能中断；核对 promtail/loki。"

  # ---- 登录暴力破解 / 认证风险（依赖 src/api/routes.py 的 login_rate_limited_total 计数器，可生效）----
  # 指标：login_rate_limited_total{reason}（counter，reason ∈ login_rate_limited|ip_rate_limited|login_backoff）。
  # 标签有界（reason），无 tenant_id/user_id/ip（IP 明细走受控审计查询，不入 Prometheus 标签）。
  - name: after-sales-login-security
    rules:
      - alert: LoginBruteForceAttempts
        expr: sum(rate(login_rate_limited_total[5m])) > 0.5
        for: 1m
        labels: {severity: critical, component: login, env: preview}
        annotations:
          summary: "登录被限流次数上升（疑似暴力破解）"
          description: "5 分钟内登录被限流（login_rate_limited_total）速率 > 0.5 次/秒。按 OPS_RUNBOOK §4：疑似爆破，检查来源 IP / 账号尝试，必要时临时收紧限流或锁定来源；IP/账号明细走 GET /api/audit 或 Loki（含 PII 脱敏）。"

  # ---- 组件重启（restart）：需新增有界指标，当前为空 ----
  - name: after-sales-component-restart
    rules:
      - alert: ComponentRestartDetected
        # 计划：新增 counter component_restart_total{component=~"api|worker|redis|postgres|nginx"}，在编排层重启处 inc。
        # 状态：**未接入**（本任务范围外，需编排层在重启事件处上报）。表达式引用不存在的指标，Prometheus 不会误报，也不会告警。
        expr: increase(component_restart_total[5m]) > 0
        for: 1m
        labels: {severity: warning, kind: restart, env: preview}
        annotations:
          summary: "组件发生重启：{{ $labels.component }}"
          description: "检测到 api/worker/redis/postgres/nginx 重启事件；核对重启韧性（数据面不依赖 Redis、读接口恢复）。需编排层接入 component_restart_total。"

  # ---- 错误率（需 status 标签，当前为空）----
  - name: after-sales-api-error-rate
    rules:
      - alert: ApiHighErrorRate
        # api_requests_total 已增加 status 标签（由 HTTP 中间件统一记录）。
        # 按 job+route+method 分维：preview(job=api) 与 prod(job=api_prod) 各自独立计算，避免两者混算稀释/误报。
        expr: |
          sum(rate(api_requests_total{status=~"5.."}[5m])) by (job, route, method)
            / clamp_min(sum(rate(api_requests_total[5m])) by (job, route, method), 0.001) > 0.05
        for: 5m
        labels: {severity: critical, component: api, status: "5xx", env: preview}
        annotations:
          summary: "API 5xx 错误率上升：route={{ $labels.route }} method={{ $labels.method }}"
          description: "5xx 占 5 分钟请求比例 > 5%。核对 Langfuse trace/Loki/审计。指标已由 HTTP 中间件按 status 记录。"

  # ---- 审批失败率（需 status/reason 标签，当前为空）----
  - name: after-sales-approval
    rules:
      - alert: ApprovalFailureRateHigh
        # approval_decisions_total 已增加 status 标签，status ∈ approved|rejected|timeout|replay|error|forbidden。
        expr: |
          sum(rate(approval_decisions_total{status=~"rejected|error|timeout"}[5m]))
            / clamp_min(sum(rate(approval_decisions_total[5m])), 0.001) > 0.05
        for: 10m
        labels: {severity: critical, component: approval, env: preview}
        annotations:
          summary: "审批决策失败率上升"
          description: "审批拒绝/异常/超时占比 > 5%。核对 GET /api/audit?target_type=approval。指标已按 status 记录。"

      - alert: ApprovalLatencyHigh
        # approval_decision_latency_seconds 直方图已接入（每次真正执行的审批决策记录延迟）。
        expr: histogram_quantile(0.95, sum(rate(approval_decision_latency_seconds_bucket[10m])) by (le)) > 30
        for: 10m
        labels: {severity: warning, component: approval, env: preview}
        annotations:
          summary: "审批耗时偏高（p95 > 30s）"
          description: "审批决策延迟 p95 超阈值。核对对外网关/Langfuse 审批 span。指标已接入。"

  # ---- 对账 mismatch（需新指标，当前为空）----
  - name: after-sales-reconcile
    rules:
      - alert: ReconciliationMismatch
        # reconcile_mismatch_total{kind} 已接入（对账不一致处 inc；kind 有界）。
        # 用 increase(...[5m]) > 0 而非 `> 0`（计数器单调递增），保证窗口内无新 mismatch 即恢复可关闭。
        expr: increase(reconcile_mismatch_total[5m]) > 0
        for: 5m
        labels: {severity: warning, kind: reconcile, env: preview}
        annotations:
          summary: "对账出现 mismatch"
          description: "5 分钟内出现对账不一致（reconcile_mismatch_total>0）。按 OPS_RUNBOOK：不一致/不可核实→转人工，绝不静默；明细走 GET /api/audit?target_type=operation。"

      - alert: NoReconciliation
        # reconcile_last_run_timestamp_seconds gauge 已在对账任务末尾写入。
        expr: time() - reconcile_last_run_timestamp_seconds > 86400
        for: 30m
        labels: {severity: warning, kind: reconcile, env: preview}
        annotations:
          summary: "对账任务超 24h 未运行"
          description: "无对账执行痕迹（最后一次对账运行已超 24h）。检查 celery 对账任务/worker 是否故障。"

  # ---- 人工介入率（需新指标 label=kind，当前为空）----
  - name: after-sales-human-intervention
    rules:
      - alert: HighHumanInterventionRate
        # human_intervention_total{kind} 已接入（order_deny/approval_timeout/execution_handoff/reconcile_mismatch/escalate...）。
        expr: |
          sum(rate(human_intervention_total[5m]))
            / clamp_min(sum(rate(api_requests_total[5m])), 0.001) > 0.20
        for: 15m
        labels: {severity: warning, kind: escalation, env: preview}
        annotations:
          summary: "人工介入率上升"
          description: "转人工/升级占比 > 20%。可能为模型档位不足/检索不过/金额或资格异常。检查 capability/RAG/写操作门控；明细走 GET /api/audit?target_type=operation。"

  # ---- RPO / RTO 突破（需新 gauge，当前为空）----
  - name: after-sales-rpo-rto
    rules:
      - alert: RpoExceeded
        # drill_rpo_seconds{component="pg_backup"} 由备份恢复演练脚本写入（RPO≤15min=900s）。
        expr: drill_rpo_seconds{component="pg_backup"} > 900
        for: 1m
        labels: {severity: critical, component: backup, env: preview}
        annotations:
          summary: "RPO 超阈值（>15min）"
          description: "实测 RPO 超 900s。按 OPS_RUNBOOK §3 视为超基线，评估回滚。gauge 由备份恢复演练脚本写入。"

      - alert: RtoExceeded
        # RTO≤60min=3600s。
        expr: drill_rto_seconds{component="pg_backup"} > 3600
        for: 1m
        labels: {severity: critical, component: backup, env: preview}
        annotations:
          summary: "RTO 超阈值（>60min）"
          description: "实测 RTO 超 3600s。按 OPS_RUNBOOK §3 视为超基线。gauge 由备份恢复演练脚本写入。"

  # ---- 租户拒绝事件（需新指标 label=kind，当前为空）----
  - name: after-sales-tenant-security
    rules:
      - alert: TenantDenialSpike
        # security_denials_total{kind} 已接入（audit_security_denial 单点 + 不可信回调），kind=审计拒绝 reason（有界）。
        expr: increase(security_denials_total[5m]) > 5
        for: 5m
        labels: {severity: warning, kind: security, env: preview}
        annotations:
          summary: "租户/安全拒绝事件激增"
          description: "5 分钟内安全拒绝 > 5 次。核对审计：GET /api/audit?target_type=... 四维追溯。指标已按 kind（reason）记录。"

      - alert: CrossTenantAccessDetected
        # 跨租户/越权访问：kind 匹配真实拒绝 reason（cross_tenant/cross_user_*/access_denied/forbidden/role_mismatch）。
        # 属合规红线，最高优先级；increase(...[5m])>0 保证窗口内无新事件即恢复可关闭。
        expr: increase(security_denials_total{kind=~"cross_tenant|cross_user_|access_denied|forbidden|role_mismatch"}[5m]) > 0
        for: 1m
        labels: {severity: critical, kind: security, env: preview}
        annotations:
          summary: "检测到跨租户/越权访问拒绝"
          description: "出现跨租户/越权访问拒绝事件。按 OPS_RUNBOOK §4：越权/跨租户走 platform_admin 独立流程 + 二次确认 + 不可抵赖审计；核对 GET /api/audit。"
