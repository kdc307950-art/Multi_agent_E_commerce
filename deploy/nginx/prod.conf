# 受控反向代理 + HTTPS（production —— after-sales-prod）
# 同源代理：浏览器只访问同源 /api/*（HTTPS），API 关闭 CORS（ENABLE_CORS=false）。
# 区别于 preview：本配置为正式生产入口 —— 受信 CA 证书 + 真实生产域名（TLS 受信证书为硬前提，
# 见 DEPLOY_BASELINE.md TLS 一节；当前内置自签 certs 非受信，故本配置为"就绪但未启用受信 TLS"）。
#
# 宿主端口映射（docker-compose.prod.yml）：宿主 8080 -> 容器 80，宿主 8843 -> 容器 443。
# 端口 80/443 已被 preview nginx 占用，故生产用独立高端口 8080/8843（见 DEPLOY_BASELINE.md）。

# ---- HTTP:80 —— 强制 HTTPS，仅保留 healthz（供容器 healthcheck）----
server {
    listen 80;
    server_name _;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS:443 —— 同源代理 ----
server {
    listen 443 ssl;
    http2 on;
    # 生产 server_name 必须为真实生产域名（受信 CA 证书链签发后由 release-manager/运维确认）。
    server_name admin.after-sales.example;

    # 受信 CA 证书链（证书、私钥、中间链）必须挂载到 /etc/nginx/certs。
    # 当前 deploy/secrets/certs 为自签（CN=preview.local），非受信 —— 上线前**必须**替换为真实 CA 签发证书链。
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    # ---- /api/metrics 内网化 ----
    # 公网（443）一律不暴露指标：精确匹配 /api/metrics 直接 404。Prometheus 经内网直连抓取。
    location = /api/metrics {
        return 404;
    }

    # ---- /api/* → api:8000（REST + SSE）----
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE：/api/chat 是流式，禁用代理缓冲、加大超时、保持长连接。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
    }

    # ---- SPA 前端 → frontend:3000 ----
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
