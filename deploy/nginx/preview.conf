# 受控反向代理 + HTTPS（preview）—— nginx 仅暴露 80/443。
# 同源代理：浏览器只访问同源 /api/*（HTTPS），API 关闭 CORS（ENABLE_CORS=false）。
# 80 一律 301 到 443；443 将 /api/* 转发到 api:8000，其余转发到 frontend:3000。

# ---- HTTP:80 —— 强制 HTTPS，仅保留 healthz（供容器 healthcheck）----
server {
    listen 80;
    server_name _;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS:443 —— 同源代理 ----
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    # ---- /api/metrics 内网化 ----
    # 公网（443）一律不暴露指标：精确匹配 /api/metrics 直接 404，不转发到 api:8000。
    # 自托管 Prometheus 不经过本公网 server，而是经内网直连 api:8000/api/metrics 抓取
    # （见 docker-compose.observability.yml 的 app-net 外部网络），且应用层仍有来源白名单
    # 双重把关（METRICS_ALLOWED_SOURCES，见 deploy/EGRESS_POLICY.md）。故此处显式阻断即可，
    # 不放行任何公网抓取。精确匹配（=）优先级高于下方 /api/ 前缀匹配。
    location = /api/metrics {
        return 404;
    }

    # ---- /api/* → api:8000（REST + SSE）----
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE：/api/chat 是流式，禁用代理缓冲、加大超时、保持长连接。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
    }

    # ---- SPA 前端 → frontend:3000 ----
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
