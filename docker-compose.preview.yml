# Docker Compose — 线上预发布（preview）拓扑（单节点，非生产 HA）
#
# 安全基线（详见 deploy/PREVIEW_DEPLOYMENT_CHECKLIST.md）：
# 1. 仅 nginx 暴露 80/443；PostgreSQL、Redis、API、前端、worker 全部仅在私有内网
#    （internal），不发布任何宿主机端口。
# 2. HTTPS 由 nginx 终结（同源代理），前端统一访问同源 /api，API 关闭 CORS（ENABLE_CORS=false）。
# 3. 演示/硬编码密码全部移除，改由服务器环境密钥注入：POSTGRES_PASSWORD、REDIS_PASSWORD、
#    APP_RUNTIME_PASSWORD、AUTH_JWT_SECRET、AUTH_LOGIN_CREDENTIALS、LLM_API_KEY、
#    EXECUTION_CALLBACK_HMAC_SECRET。
# 4. 数据库迁移角色（POSTGRES_USER=migrator，owner/DDL）与运行角色（app_runtime，
#    LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS）严格分离；api/worker 仅以运行角色连接
#    （DATABASE_URL），不执行 DDL；migrate 一次性服务以迁移角色执行建表/RLS/函数。
# 5. 受限环境 fail-closed：ENV=preview 且 AUTH_BACKEND=real 且 AUTH_JWT_SECRET 缺失时，
#    api 启动即失败；若 AUTH_BACKEND=mock 亦启动即失败（见 src/main.py fail_closed_auth_guard）。
# 6. 首次上线门控/受控执行：LAUNCH_ALLOWED_TENANTS（首批租户）+ LAUNCH_GATE_STRICT=true（受限强制），
#    EXECUTION_MODE=shadow（沙箱），EXECUTION_CALLBACK_HMAC_SECRET 必须为非默认随机密钥（check_secrets 拒绝默认值）。
#
# 用法（在本文件所在目录执行；密钥放在 deploy/.env.preview，见 .example）：
#   docker compose --env-file deploy/.env.preview -f docker-compose.preview.yml build
#   docker compose --env-file deploy/.env.preview -f docker-compose.preview.yml up -d
# 部署/迁移/回滚/健康检查见 deploy/scripts/*.sh 与 PREVIEW_DEPLOYMENT_CHECKLIST.md。

# 独立 compose 项目名：与本地开发 compose（docker-compose.yml）隔离，避免数据卷/容器/镜像冲突。
name: after-sales-preview

services:
  postgres:
    image: docker.1ms.run/library/postgres:17-alpine
    environment:
      # POSTGRES_USER 即数据库 owner（本拓扑兼任迁移角色，具备 CREATE/ALTER/CREATEROLE）。
      - POSTGRES_USER=${POSTGRES_USER:-migrator}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须由密钥注入}
      - POSTGRES_DB=${POSTGRES_DB:-langgraph}
    # 私有内网：不发布宿主端口，宿主不可达。
    networks: [internal]
    volumes: ["./data/preview-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-migrator} -d ${POSTGRES_DB:-langgraph} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  redis:
    image: docker.1ms.run/library/redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD 必须由密钥注入}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD 必须由密钥注入}
    # 私有内网：不发布宿主端口，宿主不可达。
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 一次性迁移：以迁移角色（owner）建表 + 官方 checkpoint 表 + RLS + 函数，并创建/更新
  # 运行角色 app_runtime 及其口令。api/worker 等它成功后才启动。
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.infrastructure.migrate_cli"]
    environment:
      - ENV=preview
      - DATABASE_MIGRATOR_URL=postgresql://${POSTGRES_USER:-migrator}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-langgraph}
      - APP_RUNTIME_PASSWORD=${APP_RUNTIME_PASSWORD:?APP_RUNTIME_PASSWORD 必须由密钥注入}
      - BACKUP_ROLE_PASSWORD=${BACKUP_ROLE_PASSWORD:?BACKUP_ROLE_PASSWORD 必须由密钥注入}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # 自部署网关沙箱（完全自托管，不触真实资金）：模拟真实电商/支付网关的对外最小面。
  # 对接 api/worker 的 EXECUTION_PROVIDER=sandbox_http（见启动时环境注入）：
  # - submit/query/compensate：SQLite 持久化幂等（同租户同 idempotency_key 重复提交返回同一
  #   external_txn_id / 结果，绝不重复扣款/退款；跨租户以 (tenant_id, idempotency_key) 唯一键互不覆盖）。
  # - 只挂 internal 私有网，不发布任何宿主端口；SQLite 沙箱数据持久化到挂载卷。
  # - SANDBOX_GATEWAY_API_KEY 由服务器环境密钥注入（缺失仅限本地开发放行）。
  sandbox-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.execution.sandbox_gateway"]
    environment:
      - SANDBOX_GATEWAY_DB=/data/sandbox_gateway.db
      - SANDBOX_GATEWAY_HOST=0.0.0.0
      - SANDBOX_GATEWAY_PORT=8010
      - SANDBOX_GATEWAY_API_KEY=${SANDBOX_GATEWAY_API_KEY:?SANDBOX_GATEWAY_API_KEY 必须由密钥注入（沙箱网关 API Key）}
    volumes:
      - ./data/preview-sandbox:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8010),3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # 受限环境：真实认证 + PostgreSQL 数据面 + 关闭 CORS（同源反向代理）。
      - ENV=preview
      # 发布记录所需：环境/配置版本（src.config Settings.deploy_config_version 读取；漂移审计用）。
      - DEPLOY_CONFIG_VERSION=${DEPLOY_CONFIG_VERSION:-0.1.0}
      - STORAGE_BACKEND=postgres
      - AUTH_BACKEND=real
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?AUTH_JWT_SECRET 必须由密钥注入，否则启动 fail-closed}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-after-sales}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-after-sales-web}
      - AUTH_JWT_TTL_SECONDS=${AUTH_JWT_TTL_SECONDS:-3600}
      - AUTH_JWT_KID=${AUTH_JWT_KID:-}
      - AUTH_JWT_ROTATED_SECRETS=${AUTH_JWT_ROTATED_SECRETS:-}
      - AUTH_LOGIN_CREDENTIALS=${AUTH_LOGIN_CREDENTIALS:?AUTH_LOGIN_CREDENTIALS 必须注入登录凭据表}
      # 登录凭据哈希算法：仅允许 argon2id|bcrypt（禁止无盐 sha256/md5；check_secrets 校验）。
      - AUTH_CREDENTIAL_HASH=${AUTH_CREDENTIAL_HASH:-argon2id}
      # 登录限流与失败退避（双维度：账号+IP）。preview 单进程缺省 memory；多副本可切 redis（需 REDIS_URL）。
      - LOGIN_RATE_LIMIT_STORE=${LOGIN_RATE_LIMIT_STORE:-memory}
      - LOGIN_RATE_LIMIT_WINDOW_SECONDS=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      - LOGIN_ACCOUNT_RATE_LIMIT=${LOGIN_ACCOUNT_RATE_LIMIT:-5}
      - LOGIN_IP_RATE_LIMIT=${LOGIN_IP_RATE_LIMIT:-30}
      - LOGIN_BACKOFF_MAX_FAILURES=${LOGIN_BACKOFF_MAX_FAILURES:-5}
      - LOGIN_BACKOFF_BASE_SECONDS=${LOGIN_BACKOFF_BASE_SECONDS:-1.0}
      - LOGIN_BACKOFF_MAX_SECONDS=${LOGIN_BACKOFF_MAX_SECONDS:-900}
      # 受信任反向代理头来源数（nginx 之后取最后一个可信 X-Forwarded-For 作为客户端 IP）。
      - LOGIN_TRUSTED_PROXY_DEPTH=${LOGIN_TRUSTED_PROXY_DEPTH:-1}
      # 演示/种子数据：preview/production 一律禁止 seed_default（真实租户走受控迁移/运维脚本）。
      - DEMO_SEED_ENABLED=false
      - ENABLE_CORS=false
      # 首批上线租户白名单（受限环境强制；verify_launch_gate --strict 要求非空）。
      - LAUNCH_ALLOWED_TENANTS=${LAUNCH_ALLOWED_TENANTS:?LAUNCH_ALLOWED_TENANTS 必须注入首批上线租户白名单}
      # 严格上线门控：受限环境强制开启（配合 verify_launch_gate.py --strict 双重保障）。
      - LAUNCH_GATE_STRICT=true
      - LAUNCH_REQUIRE_APPROVAL=${LAUNCH_REQUIRE_APPROVAL:-true}
      - LAUNCH_FULL_AUDIT=${LAUNCH_FULL_AUDIT:-true}
      - LAUNCH_MANUAL_REVIEW=${LAUNCH_MANUAL_REVIEW:-true}
      # 运行角色（app_runtime，非 owner）：仅 DML；preview 不允许运行角色执行 DDL。
      - DATABASE_URL=postgresql://${APP_RUNTIME_USER:-app_runtime}:${APP_RUNTIME_PASSWORD:?APP_RUNTIME_PASSWORD 必须由密钥注入}@postgres:5432/${POSTGRES_DB:-langgraph}
      - DATABASE_MIGRATE_ON_STARTUP=false
      # Redis（带口令：redis://:password@host）
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # 完全自托管 LLM（内网 OpenAI 兼容端点；预览用真实端点，密钥注入）。
      - LLM_BACKEND=${LLM_BACKEND:-openai_compatible}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://model-endpoint:8001/v1}
      - LLM_API_KEY=${LLM_API_KEY:?LLM_API_KEY 必须由密钥注入}
      - LLM_MODEL=${LLM_MODEL:-self-hosted-model}
      # 完全自托管 LLM 端点网络白名单（受限环境必须显式；空则 fail-closed，阻断未批准外联）。
      - LLM_ALLOWED_HOSTS=${LLM_ALLOWED_HOSTS:?LLM_ALLOWED_HOSTS 必须显式配置端点网络白名单}
      # 写操作能力矩阵（评测驱动）：仅白名单内且评测 write_op_pass=true 的模型可写，否则转人工。
      - HIGH_CONFIDENCE_MODELS=${HIGH_CONFIDENCE_MODELS:?HIGH_CONFIDENCE_MODELS 必须注入写操作白名单模型}
      - LLM_EVAL_REPORT_PATH=${LLM_EVAL_REPORT_PATH:-/app/evidence/llm_candidate_eval.json}
      # 受控执行面：shadow（只生成待执行记录+模拟回执，不触真实资金）| live（需沙箱端到端验收后）。
      - EXECUTION_MODE=${EXECUTION_MODE:-shadow}
      - EXECUTION_PROVIDER=${EXECUTION_PROVIDER:-sandbox_http}
      # 自部署网关沙箱（完全自托管，不触真实资金）：deploy/.env.preview.example 已把 EXECUTION_PROVIDER
      # 配置为 sandbox_http；此处显式接内网 sandbox-gateway 服务。缺 gateway_base_url 时 build_provider
      # fail-closed（绝不静默回退 mock）。GATEWAY_API_KEY 由服务器环境密钥注入。
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-http://sandbox-gateway:8010}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:?GATEWAY_API_KEY 必须由密钥注入（沙箱网关 API Key）}
      - GATEWAY_TIMEOUT_SECONDS=${GATEWAY_TIMEOUT_SECONDS:-10}
      # 回调 HMAC-SHA256 验签密钥：必须由环境密钥注入；禁止使用内建默认值（check_secrets 拒绝）。
      - EXECUTION_CALLBACK_HMAC_SECRET=${EXECUTION_CALLBACK_HMAC_SECRET:?EXECUTION_CALLBACK_HMAC_SECRET 必须由密钥注入，禁止默认值}
      # 完全自托管检索：keyword（确定性缺省）
      - RETRIEVAL_BACKEND=keyword
      - CREWAI_ENABLED=false
      - INTENT_CONFIDENCE_THRESHOLD=0.7
      # 自托管可观测（可选）：配置 LANGFUSE_* 后应用向自托管 Langfuse 发 trace
      # （metadata 含 tenant_id/session_id/environment，PII 脱敏）。缺省留空 → 追踪 no-op。
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse:3000}
      # 结构化 JSON 日志（带 tenant_id 上下文），由自托管日志链路采集；建议 preview 开启。
      - LOG_JSON_FORMAT=${LOG_JSON_FORMAT:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # /api/metrics 内网化：仅允许白名单网段抓取（受限环境 fail-closed，白名单默认即 internal
      # 网络子网 172.30.0.0/16，与下方 networks.internal 的 ipam.subnet 对齐；Prometheus 经
      # after-sales-preview_internal 直连 api:8000/api/metrics 抓取）。见 deploy/EGRESS_POLICY.md。
      - METRICS_EXPOSE_INTERNAL_ONLY=true
      - METRICS_ALLOWED_SOURCES=${METRICS_ALLOWED_SOURCES:-172.30.0.0/16}
      # t8：灾备 RPO/RTO gauge 状态文件容器内路径（由 DR 脚本经 drill_metric_exporter.py 写入 host 侧，
      # 经下方只读挂载进容器；/api/metrics 渲染时合并 drill_rpo/rto_seconds{component="pg_backup"}）。
      - DRILL_GAUGE_STATE=/app/evidence/dr_metrics/drill_gauges.json
    volumes:
      # 写操作评测报告（只读挂载进容器，供能力矩阵按 write_op_pass=true 门控；避免未设评测即全量转人工）。
      - ./evidence/llm_candidate_eval.json:/app/evidence/llm_candidate_eval.json:ro
      # t8：灾备 RPO/RTO gauge 状态目录（DR 演练脚本写入 host 侧 deploy/drills/metrics/，read-only 挂载）。
      - ./deploy/drills/metrics:/app/evidence/dr_metrics:ro
    # 私有内网：由 nginx 反向代理，不发布宿主端口。
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      sandbox-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.tasks.worker worker -l info
    environment:
      - ENV=preview
      # 发布记录所需：环境/配置版本（与 api 一致，配置漂移审计）。
      - DEPLOY_CONFIG_VERSION=${DEPLOY_CONFIG_VERSION:-0.1.0}
      # 凭据哈希与登录限流/退避配置（与 api 保持一致；worker 虽不承载登录，但配置加载统一）。
      - AUTH_CREDENTIAL_HASH=${AUTH_CREDENTIAL_HASH:-argon2id}
      - LOGIN_RATE_LIMIT_STORE=${LOGIN_RATE_LIMIT_STORE:-memory}
      - LOGIN_RATE_LIMIT_WINDOW_SECONDS=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      - LOGIN_ACCOUNT_RATE_LIMIT=${LOGIN_ACCOUNT_RATE_LIMIT:-5}
      - LOGIN_IP_RATE_LIMIT=${LOGIN_IP_RATE_LIMIT:-30}
      - LOGIN_BACKOFF_MAX_FAILURES=${LOGIN_BACKOFF_MAX_FAILURES:-5}
      - LOGIN_BACKOFF_BASE_SECONDS=${LOGIN_BACKOFF_BASE_SECONDS:-1.0}
      - LOGIN_BACKOFF_MAX_SECONDS=${LOGIN_BACKOFF_MAX_SECONDS:-900}
      - LOGIN_TRUSTED_PROXY_DEPTH=${LOGIN_TRUSTED_PROXY_DEPTH:-1}
      # 演示/种子数据：preview/production 一律禁止 seed_default。
      - DEMO_SEED_ENABLED=false
      - STORAGE_BACKEND=postgres
      - DATABASE_URL=postgresql://${APP_RUNTIME_USER:-app_runtime}:${APP_RUNTIME_PASSWORD:?APP_RUNTIME_PASSWORD 必须由密钥注入}@postgres:5432/${POSTGRES_DB:-langgraph}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # 受控执行面 + 回调验签：对账任务 build_adapter 需要同一执行模式/提供方/回调密钥。
      - EXECUTION_MODE=${EXECUTION_MODE:-shadow}
      - EXECUTION_PROVIDER=${EXECUTION_PROVIDER:-sandbox_http}
      - GATEWAY_BASE_URL=${GATEWAY_BASE_URL:-http://sandbox-gateway:8010}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY:?GATEWAY_API_KEY 必须由密钥注入（沙箱网关 API Key）}
      - GATEWAY_TIMEOUT_SECONDS=${GATEWAY_TIMEOUT_SECONDS:-10}
      - EXECUTION_CALLBACK_HMAC_SECRET=${EXECUTION_CALLBACK_HMAC_SECRET:?EXECUTION_CALLBACK_HMAC_SECRET 必须由密钥注入，禁止默认值}
      # 自托管可观测（可选）：与 api 一致。
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse:3000}
      - LOG_JSON_FORMAT=${LOG_JSON_FORMAT:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      sandbox-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 同源代理：浏览器只访问同源 /api（由 nginx 终结 HTTPS 后转发 api:8000）。
        NEXT_PUBLIC_API_BASE_URL: "/api"
        # 关闭 Next 服务端 rewrites（同源由 nginx 承担），避免预览容器内错误代理。
        API_PROXY_TARGET: ""
    environment:
      - NODE_ENV=production
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 受控反向代理 + HTTPS：仅暴露 80/443。80 一律 301 到 443；443 将 /api/* 转发到 api:8000，
  # 其余转发到 frontend:3000。同源，故 API 关闭 CORS。SSL 证书挂载自 deploy/secrets/certs。
  nginx:
    image: docker.1ms.run/library/nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/preview.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/secrets/certs:/etc/nginx/certs:ro
    networks: [edge, internal]
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 3 http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 每 15 分钟【加密】pg_dump -Fc（最小权限 backup_role）到持久 /backups，附 SHA-256 校验和，可选推送异机。
  # 把 RPO 上界真实绑定到 <=15min，并满足「加密备份 + 最小权限备份角色」红线（取代"同机 pg_dump 当结论"）。
  # 独立 sidecar 容器（postgres 镜像自带 pg_dump/openssl），挂载脚本与持久卷。
  # 安全：对称加密密钥 BACKUP_ENC_KEY 由环境变量注入（绝不硬编码/入日志）；备份连接用 backup_role（仅只读），
  #       绝不用 owner/超级用户。
  backup:
    image: docker.1ms.run/library/postgres:17-alpine
    command: ["sh", "/app/backup.sh"]
    environment:
      # 最小权限备份角色（仅 CONNECT/SELECT；migrate 服务会创建并授权 backup_role）。
      - BACKUP_DB_URL=postgresql://${BACKUP_ROLE_USER:-backup_role}:${BACKUP_ROLE_PASSWORD:?BACKUP_ROLE_PASSWORD 必须由密钥注入}@postgres:5432/${POSTGRES_DB:-langgraph}
      - BACKUP_ENC_KEY=${BACKUP_ENC_KEY:?BACKUP_ENC_KEY 必须由密钥注入（随机对称加密密钥）}
      - BACKUP_CIPHER=${BACKUP_CIPHER:-aes-256-cbc}
      - BACKUP_KEEP=${BACKUP_KEEP:-8}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-900}
      # 异机副本（可选）：受控目录（挂载到 /offsite）或 rsync 远端目标。
      - BACKUP_REMOTE_DIR=${BACKUP_REMOTE_DIR:-/offsite}
      - BACKUP_RSYNC_DEST=${BACKUP_RSYNC_DEST:-}
    volumes:
      - ./deploy/scripts/preview_backup_scheduler.sh:/app/backup.sh:ro
      - ./data/preview-backups:/backups
      # 受控异机归档目录（宿主机上代码库之外的路径；可选）。缺省用仓库内 data/ 下的 offsite 作演示。
      - ${BACKUP_REMOTE_MOUNT:-./data/preview-backups-offsite}:/offsite
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  # edge：仅 nginx 挂载，宿主经 80/443 进出的唯一通道。
  edge:
    driver: bridge
  # internal：数据面 + 应用面私网（不发布任何宿主端口，故 PostgreSQL/Redis/API/前端/worker
  # 在宿主机上无监听）。按宪法 1.8 拟设 internal:true 硬阻断出网，但实测在 Docker Desktop
  # (desktop-linux/WSL2) 下 internal:true 会破坏 Docker 内嵌 DNS 的容器名解析（migrate/api 无法
  # 解析 postgres 导致整个栈起不来），故回退为普通 bridge 以保数据面可用。出网阻断的等价落地：
  # 数据面不发布宿主端口 + LLM_BACKEND 仅内网端点（LLM_ALLOWED_HOSTS 白名单）+ 完全自托管 +
  # 若切换真实自托管 LLM 网关须把该网关容器挂到本 internal 网（见 deploy/EGRESS_POLICY.md；
  # 此为"出网阻断"的已记录边界/取舍）。
  # 固定子网 172.30.0.0/16：使 METRICS_ALLOWED_SOURCES 默认值（见 api 服务）与 Prometheus
  # 所在网段确定性一致；若该网络已以其它子网创建，需先 down 并重建（见 EGRESS_POLICY.md）。
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
